<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GKP × 早川友基 統合アプリ 体験版</title>
<style>
  :root{
    --ground:#F9F9F9; --ground-2:#EEF2F8; --panel:#FFFFFF;
    --text:#0B233F; --text-2:#41556F; --text-3:#7C8DA3;
    --line:#D9E2EE;
    --accent:#004EBC; --accent-soft:#E7EFFB;
    --ink:#0B233F; --ink-2:#12305A;
    --good:#004EBC; --warn:#C08419; --lock:#9AA7B7;
    --shadow:0 24px 60px -28px rgba(11,35,63,.4);
    --sel-bg:#0B233F; --sel-fg:#FFFFFF;
    --r:14px;
    --font:"Noto Sans JP","Hiragino Kaku Gothic ProN","Yu Gothic",-apple-system,BlinkMacSystemFont,sans-serif;
    --font-en:Copperplate,"Copperplate Gothic Light","Trajan Pro",Georgia,serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ground:#0B233F; --ground-2:#0E2B4B; --panel:#12314F;
      --text:#EEF3F9; --text-2:#9FB4CC; --text-3:#7C8DA3;
      --line:#1D3E63; --accent:#3D8BFF; --accent-soft:#0F2C4E;
      --shadow:0 24px 70px -28px rgba(0,0,0,.8);
      --sel-bg:#EEF3F9; --sel-fg:#0B233F;
    }
  }
  :root[data-theme="dark"]{
    --ground:#0B233F; --ground-2:#0E2B4B; --panel:#12314F;
    --text:#EEF3F9; --text-2:#9FB4CC; --text-3:#7C8DA3;
    --line:#1D3E63; --accent:#3D8BFF; --accent-soft:#0F2C4E;
    --shadow:0 24px 70px -28px rgba(0,0,0,.8);
    --sel-bg:#EEF3F9; --sel-fg:#0B233F;
  }
  :root[data-theme="light"]{
    --ground:#F9F9F9; --ground-2:#EEF2F8; --panel:#FFFFFF;
    --text:#0B233F; --text-2:#41556F; --text-3:#7C8DA3;
    --line:#D9E2EE; --accent:#004EBC; --accent-soft:#E7EFFB;
    --shadow:0 24px 60px -28px rgba(11,35,63,.4);
    --sel-bg:#0B233F; --sel-fg:#FFFFFF;
  }

  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--text);font-family:var(--font);
       -webkit-font-smoothing:antialiased;line-height:1.7;}
  .wrap{max-width:1180px;margin:0 auto;padding:clamp(28px,5vw,64px) clamp(18px,4vw,40px) 80px;}

  /* ---------- page header ---------- */
  .eyebrow{font-family:var(--font-en);font-size:15px;letter-spacing:.13em;color:var(--accent);font-weight:600;margin:0 0 14px}
  h1{font-size:clamp(28px,4.2vw,42px);line-height:1.25;margin:0 0 12px;letter-spacing:-.01em;text-wrap:balance}
  .lede{margin:0;max-width:62ch;color:var(--text-2);font-size:15px}
  .hint{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:7px 13px;border-radius:999px;
        background:var(--accent-soft);color:var(--accent);font-size:12.5px;font-weight:700}
  .hint span{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2.2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.hint span{animation:none}}

  /* ---------- chips ---------- */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin:34px 0 26px}
  .chip{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text-2);
        font-family:inherit;font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:999px;cursor:pointer;
        transition:border-color .15s,color .15s,background .15s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip[aria-selected="true"]{background:var(--sel-bg);border-color:var(--sel-bg);color:var(--sel-fg)}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- stage layout ---------- */
  .stage{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
  @media (max-width:860px){.stage{grid-template-columns:1fr}}

  /* ---------- phone ---------- */
  .phone{width:390px;max-width:100%;border-radius:44px;background:var(--ink);padding:11px;box-shadow:var(--shadow);
         border:1px solid var(--line);position:relative}
  .screen{position:relative;width:100%;aspect-ratio:390/812;border-radius:34px;overflow:hidden;background:#F5F7FB;
          display:flex;flex-direction:column;color:#0B233F;font-size:13px;line-height:1.6}
  .notch{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:112px;height:26px;background:var(--ink);
         border-radius:999px;z-index:5}
  .statusbar{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;padding:12px 22px 4px;
             font-size:11.5px;font-weight:700;color:#0B233F}
  .stage-badge,.filters span,.label{font-feature-settings:"palt"}
  .apphead{flex:0 0 auto;padding:6px 18px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .apphead h2{margin:0;font-size:19px;letter-spacing:-.01em}
  .apphead .sub{font-size:11.5px;color:#7C8DA3;margin:2px 0 0}
  .body{flex:1 1 auto;overflow-y:auto;overscroll-behavior:contain;padding:0 18px 12px;display:flex;flex-direction:column;gap:11px;scrollbar-width:none}
  .body::-webkit-scrollbar{display:none}
  .mini .body{overflow:hidden}
  .tabbar{flex:0 0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:9px 8px 18px;
          background:#fff;border-top:1px solid #E4EAF1}
  .tabbar button{appearance:none;border:0;background:none;font-family:inherit;font-size:10px;font-weight:700;
                 color:#9AA7B7;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:2px 0}
  .tabbar button[aria-current="true"]{color:var(--accent)}
  .tabbar svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

  /* ---------- in-screen components ---------- */
  .card{background:#fff;border-radius:14px;padding:13px 14px;border:1px solid #E4EBF4}
  .card.tap{cursor:pointer;transition:transform .12s ease, box-shadow .12s ease}
  .card.tap:hover{transform:translateY(-1px);box-shadow:0 8px 20px -12px rgba(11,35,63,.3)}
  .card.dark{background:#0B233F;border-color:#0B233F;color:#fff}
  .card.accent{background:#004EBC;border-color:#004EBC;color:#fff}
  .label{font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#7C8DA3;margin:0 0 6px}
  .card.dark .label,.card.accent .label{color:rgba(255,255,255,.72)}
  .ttl{font-size:14.5px;font-weight:700;margin:0;letter-spacing:-.01em}
  .meta{font-size:11.5px;color:#7C8DA3;margin:3px 0 0}
  .card.dark .meta{color:#9FB4CC}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .pill{font-size:10px;font-weight:800;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .pill.done{background:#E7EFFB;color:#004EBC}
  .pill.todo{background:#FFF6C2;color:#6B5D00}
  .pill.lock{background:#EEF1F5;color:#8B99AA}
  .pill.new{background:#FFF533;color:#0B233F}
  .btn{display:block;width:100%;text-align:center;background:#004EBC;color:#fff;border:0;border-radius:12px;
       padding:12px;font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
  .btn.ghost{background:#fff;color:#0B233F;border:1px solid #D9E2EE}
  .num{font-variant-numeric:tabular-nums}
  .bar{height:6px;border-radius:99px;background:#E4EBF4;overflow:hidden}
  .bar i{display:block;height:100%;background:#004EBC;border-radius:99px}
  .divider{height:1px;background:#EEF3F9;margin:2px 0}
  .listrow{display:flex;gap:10px;align-items:flex-start}
  .dot{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:#F9F9F9;color:#41556F;font-size:11px;
       font-weight:800;display:flex;align-items:center;justify-content:center}
  .scroll{overflow:hidden;display:flex;flex-direction:column;gap:11px}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:#EDF2F8;border-radius:10px;padding:3px;gap:3px}
  .seg span{text-align:center;font-size:11.5px;font-weight:700;padding:6px 4px;border-radius:8px;color:#41556F;cursor:pointer}
  .seg span.on{background:#fff;color:#0B233F;box-shadow:0 1px 3px rgba(11,35,63,.12)}
  .cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
  .cal .dow{font-size:8.5px;color:#7C8DA3;text-align:center;font-weight:800;padding-bottom:1px}
  .cal .d{aspect-ratio:1;border-radius:7px;background:#F5F7FB;display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;color:#0B233F}
  .cal .d.empty{background:transparent}
  .cal .d.pick{background:#004EBC;color:#fff}
  .cal .d.today{outline:1.5px solid #004EBC;outline-offset:-1.5px}
  .cal .dots{display:flex;gap:2px;height:4px;align-items:center}
  .cal .dots i{width:4px;height:4px;border-radius:50%}
  .legend{display:flex;gap:11px;flex-wrap:wrap;font-size:10px;color:#41556F;font-weight:700}
  .legend span{display:flex;align-items:center;gap:4px}
  .legend b{width:7px;height:7px;border-radius:50%;display:block}
  .filters{display:flex;gap:6px;overflow:hidden;flex-wrap:wrap}
  .filters span{font-size:10.5px;font-weight:700;padding:5px 10px;border-radius:999px;background:#EEF3F9;color:#41556F}
  .filters span.on{background:#0B233F;color:#fff}
  .thumb{position:relative;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#12305A,#0B233F);
         aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
  .thumb .play{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;
               justify-content:center;color:#0B233F;font-size:13px}
  .thumb .stamp{position:absolute;left:9px;bottom:8px;font-size:10px;font-weight:800;color:#fff;letter-spacing:.04em}
  .qr{width:150px;height:150px;margin:0 auto;display:block}
  .cert{background:linear-gradient(165deg,#0B233F,#154070);color:#fff;border-radius:14px;padding:16px;text-align:center}
  .cert .sig{font-size:11px;color:#9FB4CC;margin-top:12px}

  /* ---------- annotation panel ---------- */
  .notes{position:sticky;top:24px}
  .stage-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.08em;padding:5px 11px;
               border-radius:999px;background:var(--sel-bg);color:var(--sel-fg)}
  .phase-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.06em;padding:5px 11px;
               border-radius:999px;background:var(--ground-2);color:var(--text-2);margin-left:6px}
  .phase-badge.now{background:#FFF533;color:#0B233F}
  .notes h3{font-size:clamp(21px,2.6vw,27px);margin:16px 0 10px;letter-spacing:-.01em;text-wrap:balance}
  .notes p.desc{margin:0 0 22px;color:var(--text-2);font-size:14.5px;max-width:56ch}
  .solves{border-top:1px solid var(--line);padding-top:18px;display:flex;flex-direction:column;gap:14px}
  .solves .label{color:var(--text-3);margin:0}
  .solve{display:flex;gap:12px;align-items:flex-start}
  .solve b{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;
           display:flex;align-items:center;justify-content:center;margin-top:2px}
  .solve p{margin:0;font-size:14px;color:var(--text-2)}
  .solve p em{font-style:normal;color:var(--text);font-weight:700}

  /* ---------- overview grid ---------- */
  .sect{margin-top:clamp(56px,8vw,96px)}
  .sect h2{font-size:clamp(20px,2.4vw,26px);margin:0 0 6px;letter-spacing:-.01em}
  .sect .sub{margin:0 0 28px;color:var(--text-2);font-size:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:26px 20px}
  .mini{appearance:none;border:0;background:none;padding:0;font-family:inherit;cursor:pointer;text-align:left;display:block}
  .mini .holder{width:100%;overflow:hidden;border-radius:20px}
  .mini .phone{transform-origin:top left;pointer-events:none;max-width:none;width:412px}
  .mini figcaption{margin-top:11px}
  .mini .cap{font-size:13px;font-weight:700;color:var(--text)}
  .mini .capsub{font-size:11.5px;color:var(--text-3)}
  .mini:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}

  .foot{margin-top:clamp(56px,8vw,90px);border-top:1px solid var(--line);padding-top:22px;color:var(--text-3);font-size:12.5px}
  .foot b{color:var(--text-2)}

/* ---------- 体験版シェル ---------- */
  html,body{height:100%;overscroll-behavior:none}
  body{background:var(--ink);margin:0}
  .stage{min-height:100dvh;display:flex;align-items:center;justify-content:center;gap:38px;padding:34px}
  .desk{max-width:300px;color:#9FB4CC}
  .desk .mark{font-family:var(--font-en);font-size:15px;letter-spacing:.13em;color:#FFF533;font-weight:600;margin:0 0 14px}
  .desk h1{font-size:24px;color:#fff;margin:0 0 12px;line-height:1.4}
  .desk p{font-size:13.5px;line-height:1.8;margin:0 0 10px}
  .desk .qrnote{font-size:12px;color:#7C8DA3;margin-top:18px}
  .screen{aspect-ratio:390/812;height:min(812px,calc(100dvh - 68px));width:390px;max-width:100%}
  .back{appearance:none;border:0;background:#EEF3F9;width:32px;height:32px;border-radius:50%;
        font-size:17px;line-height:1;color:#0B233F;cursor:pointer;flex:0 0 auto;font-family:var(--font)}
  .back:active{background:#DCE5F1}
  .apphead{align-items:flex-start}
  .apphead .heads{flex:1;min-width:0}
  .card.tap:active{transform:scale(.985)}
  .btn:active{filter:brightness(.94)}
  .fade{animation:fade .18s ease-out}
  @keyframes fade{from{opacity:.35;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}}
  .tabbar button:active{opacity:.6}

  #splash{position:fixed;inset:0;z-index:50;background:var(--ink);display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:20px;text-align:center;padding:32px}
  #splash .w{font-family:var(--font-en);font-size:clamp(19px,5vw,25px);letter-spacing:.12em;color:#fff;font-weight:600}
  #splash .t{font-size:13px;color:#9FB4CC;line-height:1.9;max-width:22em}
  #splash .badge{font-size:11px;font-weight:800;letter-spacing:.1em;color:#0B233F;background:#FFF533;
                 padding:5px 12px;border-radius:999px}
  #splash button{appearance:none;border:0;background:#004EBC;color:#fff;font-family:var(--font);font-weight:700;
                 font-size:15px;padding:14px 42px;border-radius:999px;cursor:pointer;margin-top:6px}
  #splash button:active{filter:brightness(.92)}
  #splash.hide{opacity:0;pointer-events:none;transition:opacity .3s}

  @media (max-width:820px){
    .stage{padding:0;gap:0}
    .desk{display:none}
    .phone{width:100%;height:100dvh;border-radius:0;padding:0;border:0;box-shadow:none;background:#F5F7FB}
    .notch{display:none}
    .screen{border-radius:0;aspect-ratio:auto;width:100%;height:100dvh}
    .statusbar{display:none}
    .apphead{padding-top:calc(14px + env(safe-area-inset-top))}
    .tabbar{padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  }
</style>

<div class="stage">
  <div class="desk">
    <p class="mark">GOAL KEEPER PROJECT × 早川友基</p>
    <h1>統合アプリ 体験版</h1>
    <p>実際の画面の流れを、そのまま触って確認できます。タブとカードはすべて動きます。</p>
    <p>表示している選手名・日程・数値はサンプルです。12月の関東クリニックでのローンチ時点では、受付・会員登録・記録まわりから開放します。</p>
    <p class="qrnote">スマートフォンでこのページを開くと、全画面のアプリとして表示されます。</p>
  </div>
  <div class="phone">
    <div class="notch"></div>
    <div class="screen" id="screen"></div>
  </div>
</div>

<div id="splash">
  <span class="badge">体験版</span>
  <p class="w">GOAL KEEPER PROJECT</p>
  <p class="t">全国のクリニック参加者を、その場で会員に。<br>週1本の配信と添削で、関係を切らさない。</p>
  <button id="start" type="button">はじめる</button>
</div>

<script>
(function(){
  const ICONS = {
    home:'<svg viewBox="0 0 24 24"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
    train:'<svg viewBox="0 0 24 24"><path d="M6.5 8v8M17.5 8v8M3.5 10.5v3M20.5 10.5v3M6.5 12h11"/></svg>',
    video:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 12 5-3.2v6.4z"/></svg>',
    ev:'<svg viewBox="0 0 24 24"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/></svg>',
    my:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg>'
  };

  function qr(seed){
    let s=seed, out='';
    const rnd=()=>{s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};
    const N=25;
    for(let y=0;y<N;y++)for(let x=0;x<N;x++){
      const corner=(x<7&&y<7)||(x>N-8&&y<7)||(x<7&&y>N-8);
      if(corner) continue;
      if(rnd()>0.52) out+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';
    }
    const eye=(x,y)=>'<path d="M'+x+' '+y+'h7v7h-7z" fill="none" stroke="#0B233F" stroke-width="1"/><rect x="'+(x+2)+'" y="'+(y+2)+'" width="3" height="3"/>';
    return '<svg class="qr" viewBox="0 0 25 25" fill="#0B233F" aria-label="受付用QRコード">'+out+eye(0,0)+eye(18,0)+eye(0,18)+'</svg>';
  }

  function radar(vals, prev){
    const cx=90, cy=86, R=64, n=5;
    const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v, cy+Math.sin(a)*R*v];};
    const poly=a=>a.map((v,i)=>pt(i,v).join(',')).join(' ');
    let rings='';
    [1,.75,.5,.25].forEach(r=>{rings+='<polygon points="'+poly([r,r,r,r,r])+'" fill="none" stroke="#DCE5F1" stroke-width="1"/>';});
    const labels=['キャッチ','ハイボール','パスキック','ポジショニング','1対1'];
    let lab='';
    labels.forEach((t,i)=>{const p=pt(i,1.3);lab+='<text x="'+p[0]+'" y="'+(p[1]+3)+'" text-anchor="middle" font-size="8" fill="#7C8DA3" font-weight="700">'+t+'</text>';});
    return '<svg viewBox="0 0 180 175" style="width:100%;height:auto">'+rings+
      '<polygon points="'+poly(prev)+'" fill="none" stroke="#9AA7B7" stroke-width="1.4" stroke-dasharray="3 3"/>'+
      '<polygon points="'+poly(vals)+'" fill="rgba(0,78,188,.15)" stroke="#004EBC" stroke-width="2"/>'+lab+'</svg>';
  }

  function cal(days){
    return days.map(x=>{
      if(!x.d) return '<div class="d empty"></div>';
      let dots='';
      if(x.mt) dots+='<i style="background:#004EBC"></i>';
      if(x.ev) dots+='<i style="background:#E5B700"></i>';
      const cls='d'+(x.pick?' pick':'')+(x.today?' today':'');
      return '<div class="'+cls+'"><span>'+x.d+'</span><span class="dots">'+
             (x.pick?'<i style="background:#fff"></i>':dots)+'</span></div>';
    }).join('');
  }

  const S = {};

  S.home = {
    tab:'home', title:'ホーム', sub:'木下 蓮 ／ U-10',
    body:`
      <div class="card accent tap" data-go="training">
        <p class="label">今週のトレーニング</p>
        <p class="ttl" style="font-size:15.5px">第14週 パスキックの精度</p>
        <p class="meta" style="color:rgba(255,255,255,.85)">動画 12分 ＋ 課題 1本 ／ 締切まで2日</p>
        <button class="btn ghost" style="margin-top:11px">はじめる</button>
      </div>
      <div class="card tap" data-go="feedback">
        <div class="row"><p class="ttl">早川コーチから添削が届きました</p><span class="pill new">NEW</span></div>
        <p class="meta">第13週 ハイボールのキャッチ ／ 8月2日</p>
      </div>

    const s = S[id];
    const canBack = stack.length > 0;

      <div class="statusbar"><span class="num">9:41</span><span style="font-family:var(--font-en);letter-spacing:.1em;font-weight:600">GKP</span></div>

  }

  function go(id, push){
    if(MAIN.indexOf(id) >= 0){ stack = []; }
    else if(push && id !== current){ stack.push(current); }
    current = id;
    paint(id);
  }

  screen.addEventListener('click', e => {
    if(e.target.closest('[data-back]')){ const prev = stack.pop() || 'home'; current = prev; paint(prev); return; }
    const tab = e.target.closest('[data-tab]');
    if(tab){ go(TAB_HOME[tab.dataset.tab], false); return; }
    const nav = e.target.closest('[data-go]');
    if(nav){ go(nav.dataset.go, true); }
  });

  });
